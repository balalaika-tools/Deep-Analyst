[tool.uv]
required-version = "==0.12.4"

[tool.uv.workspace]
members = [
    "services/*",
    "libs/*",
    "data/dataset",
]
# The Next.js frontend lives under services/ but is not a Python package.
exclude = ["services/investigation_web"]

[dependency-groups]
dev = [
    "mypy>=2.3.0,<3",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pre-commit>=4.6.1,<5",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=7.1.0,<8",
    "pyyaml>=6.0.2,<7",
    "ruff>=0.16.3,<0.17",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Agent skill bundles carry example code that is not part of this repository's style gate.
extend-exclude = [".agents", ".claude", ".codex"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "-m",
    "not integration and not live",
]
testpaths = ["services", "libs", "data/dataset", "tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a disposable PostgreSQL target named by TEST_DATABASE_URL",
    "live: calls a paid external provider; opt in with -m live",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
# Several members own a tests/conftest.py; package bases keep their module names distinct.
explicit_package_bases = true
mypy_path = [
    "libs/evidence_model/src",
    "libs/observability/src",
    "services/ingestion/src",
    "services/investigation_agent/src",
    "data/dataset/src",
]

[[tool.mypy.overrides]]
module = ["pgvector.*", "botocore.*", "boto3.*"]
ignore_missing_imports = true
