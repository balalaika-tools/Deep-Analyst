[project]
name = "evidence-model"
version = "0.1.0"
description = "Evidence store schema shared by ingestion and the investigation agent"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pgvector>=0.4.1,<0.5",
    "pydantic>=2.12,<3",
    "sqlalchemy>=2.0.46,<3",
    "sqlmodel>=0.0.32,<0.1",
]

[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"
