[project]
name = "observability"
version = "0.1.0"
description = "OpenTelemetry lifecycle, span helpers, and structlog correlation shared by services"
requires-python = ">=3.13,<3.14"
dependencies = [
    "opentelemetry-api>=1.44,<1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<1.45",
    "opentelemetry-sdk>=1.44,<1.45",
    "structlog>=25.5",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=1.6,<2",
]

[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"
