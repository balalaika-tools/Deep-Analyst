[project]
name = "ingestion"
version = "0.1.0"
description = "One-shot ingestion of the synthetic case fixture into the evidence store"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.43.86,<2",
    "evidence-model",
    "langchain>=1.3,<2",
    "langchain-aws>=1.2",
    "observability[langchain]",
    "pgvector>=0.4.1,<0.5",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "pyyaml>=6.0.2,<7",
    "sqlalchemy[asyncio]>=2.0.46,<3",
    "sqlmodel>=0.0.32,<0.1",
    "structlog>=25.5",
]

[project.scripts]
ingest-case = "ingestion.main:main"

[tool.uv.sources]
evidence-model = { workspace = true }
observability = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"
