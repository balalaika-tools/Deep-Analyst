[project]
name = "investigation-agent"
version = "0.1.0"
description = "Checkpointed, evidence-grounded investigation agent service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.43.86,<2",
    "evidence-model",
    "fastapi>=0.115,<1",
    "langchain==1.3.18",
    "langchain-aws==1.7.4",
    "langchain-core==1.6.1",
    "langgraph==1.2.11",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "observability[langchain]",
    "pglast>=7,<8",
    "pgvector>=0.4,<1",
    "psycopg[binary,pool]>=3.3,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "pyyaml>=6.0.2,<7",
    "sse-starlette>=3,<4",
    "structlog>=25.5",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
investigation-agent = "investigation_agent.main:main"
agent-db-init = "investigation_agent.main:initializer_main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
]

[tool.uv.sources]
evidence-model = { workspace = true }
observability = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"
