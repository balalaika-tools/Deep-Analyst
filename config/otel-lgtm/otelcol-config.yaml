# Local development only. The LGTM image loads this file instead of its bundled Collector config.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /ready

receivers:
  otlp/operational:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  otlp/genai:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4327
      http:
        endpoint: 0.0.0.0:4328
        cors:
          allowed_origins:
            - http://*
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: opentelemetry-collector
          scrape_interval: 5s
          static_configs:
            - targets: [127.0.0.1:8888]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  resource/environment:
    attributes:
      - key: deployment.environment.name
        value: development
        action: insert

  attributes/drop_secrets:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set_cookie
        action: delete
      - key: db.query.text
        action: delete
      - key: db.statement
        action: delete
      - key: user.email
        action: delete

  # Exception logs remain the detailed, correlated error record.
  attributes/drop_trace_exception_detail:
    actions:
      - key: exception.message
        action: delete
      - key: exception.stacktrace
        action: delete

  # Defense in depth for every trace sent to Tempo. Producers still own content capture.
  attributes/drop_genai_content:
    actions:
      - key: gen_ai.system_instructions
        action: delete
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: gen_ai.tool.definitions
        action: delete
      - key: gen_ai.tool.call.arguments
        action: delete
      - key: gen_ai.tool.call.result
        action: delete
      - key: app.gen_ai.observation.input
        action: delete
      - key: app.gen_ai.observation.output
        action: delete

  # The application emits backend-neutral, content-gated presentation values.
  # Project them only on the Langfuse branch, then remove the neutral copies so
  # they do not appear again as observation metadata.
  attributes/langfuse_observation_io:
    actions:
      - key: langfuse.observation.input
        from_attribute: app.gen_ai.observation.input
        action: upsert
      - key: langfuse.observation.output
        from_attribute: app.gen_ai.observation.output
        action: upsert
      - key: app.gen_ai.observation.input
        action: delete
      - key: app.gen_ai.observation.output
        action: delete

  # Every retained span is classified in application code, including the root and
  # minimal logical ancestors, so dropping the rest cannot orphan the projection.
  filter/langfuse_projection:
    error_mode: ignore
    trace_conditions:
      - 'span.attributes["app.telemetry.category"] != "genai"'

  batch:
    timeout: 1s
    send_batch_size: 128

exporters:
  otlp_http/tempo:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true

  otlp_http/prometheus:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true

  otlp_http/loki:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true

  otlp_http/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_AUTH_STRING}"
      x-langfuse-ingestion-version: "4"

service:
  extensions: [health_check]
  pipelines:
    traces/operational-tempo:
      receivers: [otlp/operational]
      processors:
        - memory_limiter
        - resource/environment
        - attributes/drop_secrets
        - attributes/drop_trace_exception_detail
        - attributes/drop_genai_content
        - batch
      exporters: [otlp_http/tempo]

    traces/genai-tempo:
      receivers: [otlp/genai]
      processors:
        - memory_limiter
        - resource/environment
        - attributes/drop_secrets
        - attributes/drop_trace_exception_detail
        - attributes/drop_genai_content
        - batch
      exporters: [otlp_http/tempo]

    traces/genai-langfuse:
      receivers: [otlp/genai]
      processors:
        - memory_limiter
        - resource/environment
        - attributes/drop_secrets
        - filter/langfuse_projection
        - attributes/langfuse_observation_io
        - batch
      exporters: [otlp_http/langfuse]

    metrics/operational-prometheus:
      receivers: [otlp/operational, prometheus/collector]
      processors: [memory_limiter, resource/environment, attributes/drop_secrets, batch]
      exporters: [otlp_http/prometheus]

    logs/operational-loki:
      receivers: [otlp/operational]
      processors: [memory_limiter, resource/environment, attributes/drop_secrets, batch]
      exporters: [otlp_http/loki]
